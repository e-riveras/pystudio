[project]
name = "pystudio-tui"
version = "0.1.0"
description = "A terminal IDE for Python data science: embedded Neovim, a Jupyter kernel, variables and plots in one screen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eduardo Rivera", email = "ef.riveras@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ide", "terminal", "tui", "neovim", "jupyter", "data-science", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "msgpack>=1.2.3",
    "textual>=8.2.8",
    "textual-image>=0.14.1",
]

[project.urls]
Homepage = "https://github.com/e-riveras/pystudio"
Repository = "https://github.com/e-riveras/pystudio"
Issues = "https://github.com/e-riveras/pystudio/issues"
Changelog = "https://github.com/e-riveras/pystudio/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pystudio"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "textual-dev>=1.8.0",
]

[project.scripts]
pystudio = "pystudio.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
